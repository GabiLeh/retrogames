<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>RetroGames 👾​</h1>
        <p>Venda de jogos retros!</p>
    </header>
    <main class = "container">
        <div class = "titulo-secao">
            <div class="catalogo">
                <h2>Nosso catalogo</h2>
                <p>Conheça os jogos disponíveis</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar jogo</button>
        </div>
        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>
    <dialog id = "modalCadastro">
        <h2>Novo Jogo</h2>
        <form id = "formJogos">
            <label for="jogo">Nome do jogo</label>
            <input type="text" id="jogo" required>
            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" required>
            <label for="desenvolvedor">Desenvolvedor</label>
            <input type="text" id="desenvolvedor" required>
            <label for="genero">Gênero</label>
            <input type="text" id="genero" required>
            <label for="imagem">URL da imagem do jogo</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01"required>
            <label for="data_cadastro">Data e hora</label>
            <input type="datetime-local" id="data_cadastro" required>
            <div class = "acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>
    <script src="script.js"></script>
</body>
</html>
